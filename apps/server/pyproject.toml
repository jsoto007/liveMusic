[project]
name = "live-msc-server"
version = "0.1.0"
description = "Live Msc API — Flask + SQLAlchemy"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0,<3.2.0",
  "flask-sqlalchemy>=3.1.1",
  "flask-migrate>=4.0.5",
  "flask-cors>=4.0.0",
  "flask-limiter>=3.7.0",
  "flask-talisman>=1.1.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg2-binary>=2.9.9",
  "bcrypt>=4.1.0",
  "PyJWT>=2.8.0",
  "boto3>=1.34.0",
  "python-dotenv>=1.0.1",
  "python-json-logger>=2.0.7",
  "gunicorn>=22.0.0",
  "redis>=5.0.0",
  # Outbound HTTP: the Resend transport and the LocationIQ proxy.
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6.2",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
# S101 (assert) is the whole point of a test file.
# S101 assert is the point of a test; S105-S107 flag the fake passwords the
# fixtures use, which is exactly what test fixtures are for.
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "S107"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
