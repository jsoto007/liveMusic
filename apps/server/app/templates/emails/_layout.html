{# The shell every message is set in.

   Email is not the web. Everything here is inline-styled and table-based
   because Outlook still uses Word to render HTML, and `<style>` blocks, flex,
   grid and CSS variables are all unreliable or simply ignored. The Classical
   tokens are therefore written out as literal values — this is the one place
   in the codebase where that is correct rather than a violation of §1.

   The webfonts are requested but a serif stack follows them: most clients
   will not load a remote font, and the message has to read properly in
   Georgia when they don't. #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{ title }}</title>
  </head>
  <body style="margin:0; padding:0; background:#eae9e9;">
    {# Preheader: the grey line a client shows next to the subject. Hidden in
       the body itself, so it must not repeat the first paragraph. #}
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      {{ preheader | default('') }}
    </div>

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:#eae9e9; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                 style="max-width:560px; background:#f3f2f2; border:1px solid rgba(32,31,29,0.16);">

            <!-- Masthead -->
            <tr>
              <td style="padding:28px 32px 0;">
                <a href="{{ site_url }}"
                   style="font-family:'Cormorant Garamond',Cormorant,Garamond,Georgia,serif;
                          font-size:30px; line-height:1; letter-spacing:0.01em;
                          color:#201f1d; text-decoration:none;">Live&nbsp;Msc</a>
                <div style="font-family:Lora,Georgia,serif; font-size:9.5px; letter-spacing:0.14em;
                            text-transform:uppercase; color:rgba(32,31,29,0.5); margin-top:6px;">
                  A listings paper for live music
                </div>
                <div style="height:1px; background:rgba(32,31,29,0.16); margin-top:14px;"></div>
              </td>
            </tr>

            <!-- Body -->
            <tr>
              <td style="padding:28px 32px 8px; font-family:Lora,Georgia,serif;
                         font-size:15px; line-height:1.7; color:#201f1d;">
                {% block content %}{% endblock %}
              </td>
            </tr>

            <!-- Colophon -->
            <tr>
              <td style="padding:8px 32px 28px;">
                <div style="height:1px; background:rgba(32,31,29,0.16); margin-bottom:14px;"></div>
                <p style="margin:0; font-family:Lora,Georgia,serif; font-size:11px;
                          line-height:1.6; color:rgba(32,31,29,0.45);">
                  {% block footer %}
                    Set and printed nightly. Corrections to the editor.
                  {% endblock %}
                  {% if unsubscribe_url %}
                    <br />
                    <a href="{{ unsubscribe_url }}" style="color:#7d5411;">Unsubscribe</a>
                    from these notices, or change what you hear about in
                    <a href="{{ site_url }}/account" style="color:#7d5411;">your account</a>.
                  {% endif %}
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
