{# An outlined button, the Classical way: an accent stroke on transparent,
   never a fill. Built as a table because Outlook ignores padding on an
   anchor, which would collapse it to bare text. #}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:20px 0;">
  <tr>
    <td style="border:1px solid #b68235; border-radius:4px;">
      <a href="{{ url }}"
         style="display:inline-block; padding:11px 22px;
                font-family:'Cormorant Garamond',Cormorant,Garamond,Georgia,serif;
                font-size:15px; line-height:1.2; color:#7d5411; text-decoration:none;">
        {{ label }}
      </a>
    </td>
  </tr>
</table>
